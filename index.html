<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <title>Online Terminal with Snake</title>
</head>
<body>
    <script src="libv86.js"></script>
    <script>
    "use strict";
    window.onload = function() {
        var emulator = new V86({
            wasm_path: "v86.wasm",
            memory_size: 32 * 1024 * 1024,
            vga_memory_size: 8 * 1024 * 1024,
            screen_container: document.getElementById("screen_container"),
            bios: { url: "bios/seabios.bin" },
            vga_bios: { url: "bios/vgabios.bin" },
            cdrom: { url: "core/TC-remastered.iso" },
            autostart: true
        });
    };
    </script>

    <div id="screen_container">
        <div style="white-space: pre; font: 14px monospace; line-height: 14px"></div>
        <canvas style="display: none"></canvas>
    </div>

    <div>To run snake, wait until the terminal loads (this may take a few seconds), then press enter, type <code>./snek</code> and press enter again.</div>
</body>
</html>
